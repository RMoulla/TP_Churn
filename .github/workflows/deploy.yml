name: CI/CD for Churn Prediction

on:
  push:
    branches:
      - main
    paths:
      - "train.py"
      - "app.py"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t redha-test .

      - name: Run tests in Docker
        run: |
          docker run --rm redha-test python -m pytest -q

      - name: Install Elastic Beanstalk CLI
        run: |
          pip install awsebcli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Initialize Elastic Beanstalk
        run: |
          eb init redha-test \
            --platform docker \
            --region eu-west-1

      - name: Create environment if needed
        run: |
          eb status churn-env || eb create churn-env \
            --single \
            --instance_type t3.micro

      - name: Deploy to Elastic Beanstalk
        run: |
          eb deploy churn-env
